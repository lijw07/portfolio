name: Generate sitemap

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build-sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate the sitemap
        id: sitemap
        uses: cicirello/generate-sitemap@v1
        with:
          base-url-path: https://lijw07.github.io/portfolio/
          path-to-root: public

      - name: Show where the action wrote the sitemap
        run: |
          echo "Sitemap path from action: ${{ steps.sitemap.outputs.sitemap-path }}"

      - name: Place sitemap in public/
        run: |
          SITEMAP_PATH="${{ steps.sitemap.outputs.sitemap-path }}"
          mkdir -p public
          if [ -z "$SITEMAP_PATH" ]; then
            if [ -f "sitemap.xml" ]; then
              SITEMAP_PATH="sitemap.xml"
            elif [ -f "public/sitemap.xml" ]; then
              SITEMAP_PATH="public/sitemap.xml"
            else
              echo "❌ Could not locate generated sitemap.xml"
              exit 1
            fi
          fi
          echo "Using sitemap at: $SITEMAP_PATH"
          if [ "$(realpath "$SITEMAP_PATH")" != "$(realpath -m public/sitemap.xml)" ]; then
            cp "$SITEMAP_PATH" public/sitemap.xml
          else
            echo "Sitemap already in public/, nothing to copy."
          fi

      - name: Ensure robots.txt
        run: |
          mkdir -p public
          if [ ! -f public/robots.txt ]; then
            printf '%s\n' \
              'User-agent: *' \
              'Allow: /' \
              '' \
              'Sitemap: https://lijw07.github.io/portfolio/sitemap.xml' \
              > public/robots.txt
          fi

      - name: Commit sitemap/robots if changed
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/sitemap.xml public/robots.txt
            git commit -m "chore: ensure sitemap/robots published under /portfolio/"
            git push
          else
            echo "No changes to commit."
          fi