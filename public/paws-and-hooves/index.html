<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Index_PawsAndHooves</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1a1a1a;
      font-family: Arial, Helvetica, sans-serif;
    }
    /* The container and canvas fill the whole browser window.
       Unity automatically matches the render buffer to the canvas'
       CSS size, so the game (and the Scale-With-Screen UI) resizes
       responsively as the window changes. */
    #unity-container {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
    }
    #unity-canvas {
      width: 100%;
      height: 100%;
      display: block;
      background: #1a1a1a;
    }
    #unity-loading {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: #eee;
    }
    #unity-logo {
      font-size: 28px;
      font-weight: bold;
      letter-spacing: 1px;
      margin-bottom: 18px;
    }
    #unity-progress-track {
      width: 260px;
      height: 10px;
      background: #333;
      border-radius: 5px;
      overflow: hidden;
      margin: 0 auto;
    }
    #unity-progress-fill {
      width: 0%;
      height: 100%;
      background: #f5c542;
      transition: width 0.1s ease-out;
    }
    #unity-warning {
      position: absolute;
      left: 50%;
      top: 8px;
      transform: translateX(-50%);
      color: #fff;
      background: #b00;
      padding: 6px 12px;
      border-radius: 4px;
      display: none;
    }
  </style>
</head>
<body>
  <div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="unity-loading">
      <div id="unity-logo">Index_PawsAndHooves</div>
      <div id="unity-progress-track"><div id="unity-progress-fill"></div></div>
    </div>
    <div id="unity-warning"></div>
  </div>

  <script>
    var container = document.querySelector("#unity-container");
    var canvas = document.querySelector("#unity-canvas");
    var loadingBox = document.querySelector("#unity-loading");
    var progressFill = document.querySelector("#unity-progress-fill");
    var warningBanner = document.querySelector("#unity-warning");

    function unityShowBanner(msg, type) {
      warningBanner.innerHTML = msg;
      warningBanner.style.display = "block";
      if (type !== "error") {
        setTimeout(function () { warningBanner.style.display = "none"; }, 5000);
      }
    }

    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/PawsAndHoovesWebGl.loader.js";
    var config = {
      dataUrl: buildUrl + "/PawsAndHoovesWebGl.data.unityweb",
      frameworkUrl: buildUrl + "/PawsAndHoovesWebGl.framework.js.unityweb",
      codeUrl: buildUrl + "/PawsAndHoovesWebGl.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Index",
      productName: "Index_PawsAndHooves",
      productVersion: "0.1",
      showBanner: unityShowBanner,
    };

    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = function () {
      createUnityInstance(canvas, config, function (progress) {
        progressFill.style.width = (100 * progress) + "%";
      }).then(function (unityInstance) {
        loadingBox.style.display = "none";
      }).catch(function (message) {
        unityShowBanner(message, "error");
      });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
