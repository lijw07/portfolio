<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes" />
  <title>Jai Li — Games</title>
  <meta name="description" content="Indie games by Jai Li. Play in your browser or download builds." />
  <meta name="robots" content="index, follow" />

  <meta property="og:title" content="Jai Li — Games" />
  <meta property="og:description" content="Indie games by Jai Li. Play or download." />
  <meta property="og:type" content="website" />

  <link rel="preconnect" href="https://fonts.cdnfonts.com" crossorigin />
  <link href="https://fonts.cdnfonts.com/css/pixellari" rel="stylesheet" />

  <style>
    /* ── Reset & Variables ── */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    :root {
      --bg-color: white;
      --text-color: black;
      --card-bg: #f5f5f5;
      --card-border: #ddd;
      --tag-bg: #e8e8e8;
      --scale-factor: clamp(6px, min(1vw, 1.5vh), 16px);
      --base-size: calc(16 * var(--scale-factor));
    }

    [data-theme="dark"] {
      --bg-color: black;
      --text-color: white;
      --card-bg: #111;
      --card-border: #333;
      --tag-bg: #222;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'Pixellari', sans-serif;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.3s ease, color 0.3s ease;
      -webkit-user-select: none;
      user-select: none;
      overflow-x: hidden;
    }

    /* ── Theme Toggle ── */
    .theme-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 1000;
      background: none;
      border: 2px solid var(--text-color);
      color: var(--text-color);
      font-family: 'Pixellari', sans-serif;
      font-size: clamp(0.8rem, 1.5vw, 1rem);
      padding: 6px 14px;
      cursor: pointer;
      image-rendering: pixelated;
      transition: all 0.3s ease;
    }

    .theme-toggle:hover {
      background-color: var(--text-color);
      color: var(--bg-color);
    }

    /* ── Back Link ── */
    .back-link {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 1000;
      color: var(--text-color);
      text-decoration: none;
      font-family: 'Pixellari', sans-serif;
      font-size: clamp(0.8rem, 1.5vw, 1rem);
      border: 2px solid var(--text-color);
      padding: 6px 14px;
      transition: all 0.3s ease;
    }

    .back-link:hover {
      background-color: var(--text-color);
      color: var(--bg-color);
    }

    /* ── Hero ── */
    .hero {
      text-align: center;
      padding: 120px 40px 60px;
    }

    .hero h1 {
      font-size: clamp(3rem, 8vw, 6rem);
      font-weight: normal;
      margin-bottom: 0.5rem;
    }

    .hero p {
      font-size: clamp(1rem, 2.5vw, 1.5rem);
      opacity: 0.7;
    }

    .cursor {
      animation: blink 1s step-end infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* ── Games Grid ── */
    .games-section {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 40px 120px;
    }

    .games-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: calc(4 * var(--scale-factor));
    }

    /* ── Game Card ── */
    .game-card {
      border: 2px solid var(--card-border);
      background: var(--card-bg);
      overflow: hidden;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      display: grid;
      grid-template-columns: 300px 1fr;
      min-height: 220px;
    }

    .game-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.15);
    }

    [data-theme="dark"] .game-card:hover {
      box-shadow: 0 8px 24px rgba(255,255,255,0.08);
    }

    .game-card-thumbnail {
      width: 100%;
      height: 100%;
      object-fit: cover;
      image-rendering: pixelated;
      background: var(--tag-bg);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .game-card-thumbnail img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      image-rendering: pixelated;
    }

    .game-card-placeholder {
      width: 100%;
      height: 100%;
      background: var(--tag-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      opacity: 0.3;
    }

    .game-card-body {
      padding: calc(3 * var(--scale-factor));
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .game-card-title {
      font-size: clamp(1.5rem, 3vw, 2rem);
      font-weight: normal;
      margin-bottom: 8px;
    }

    .game-card-description {
      font-size: clamp(0.9rem, 1.8vw, 1.1rem);
      opacity: 0.8;
      line-height: 1.6;
      margin-bottom: 16px;
    }

    .game-card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }

    .tag {
      font-family: 'Pixellari', sans-serif;
      font-size: clamp(0.65rem, 1.2vw, 0.8rem);
      background: var(--tag-bg);
      border: 1px solid var(--card-border);
      padding: 3px 10px;
      white-space: nowrap;
    }

    .game-card-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn {
      font-family: 'Pixellari', sans-serif;
      font-size: clamp(0.85rem, 1.5vw, 1rem);
      padding: 8px 20px;
      text-decoration: none;
      border: 2px solid var(--text-color);
      color: var(--text-color);
      background: transparent;
      cursor: pointer;
      transition: all 0.25s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn:hover {
      background-color: var(--text-color);
      color: var(--bg-color);
    }

    .btn-primary {
      background-color: var(--text-color);
      color: var(--bg-color);
    }

    .btn-primary:hover {
      background: transparent;
      color: var(--text-color);
    }

    /* ── Footer ── */
    .footer {
      text-align: center;
      padding: 40px;
      font-size: clamp(0.8rem, 1.5vw, 1rem);
      opacity: 0.5;
      border-top: 1px dashed var(--card-border);
      max-width: 1200px;
      margin: 0 auto;
    }

    .footer a {
      color: var(--text-color);
    }

    /* ── Fade-in Animation ── */
    .fade-in {
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }

    .fade-in.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* ── Responsive ── */
    @media (max-width: 768px) {
      .game-card {
        grid-template-columns: 1fr;
        min-height: auto;
      }

      .game-card-thumbnail,
      .game-card-placeholder {
        height: 180px;
      }

      .games-section {
        padding: 20px 20px 100px;
      }

      .hero {
        padding: 100px 20px 40px;
      }
    }

    @media (max-width: 480px) {
      .game-card-actions {
        flex-direction: column;
      }

      .btn {
        text-align: center;
        justify-content: center;
      }
    }
  </style>
</head>
<body>

  <a href="https://lijw07.github.io/portfolio/" class="back-link">&lt; Portfolio</a>
  <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme">light</button>

  <div class="hero">
    <h1 id="hero-title"></h1>
    <p>indie games by Jai Li</p>
  </div>

  <section class="games-section">
    <div class="games-grid" id="games-grid"></div>
  </section>

  <footer class="footer">
    <a href="https://lijw07.github.io/portfolio/">back to portfolio</a>
  </footer>

  <script>
    /* ── Theme ── */
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
      document.querySelector('.theme-toggle').textContent = 'dark';
    }

    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      document.querySelector('.theme-toggle').textContent = next;
      localStorage.setItem('theme', next);
    }

    /* ── Typing Effect ── */
    const title = 'Games';
    let i = 0;
    const heroEl = document.getElementById('hero-title');

    function type() {
      if (i <= title.length) {
        heroEl.innerHTML = title.slice(0, i) + '<span class="cursor">|</span>';
        i++;
        setTimeout(type, 200);
      }
    }
    type();

    /* ── Game Data ── */
    const games = [
      {
        title: 'Paws and Hooves',
        description: 'A 2D adventure game built in Unity. Explore, interact, and discover a world of animal companions.',
        tags: ['Unity', 'C#', '2D', 'Adventure'],
        thumbnail: null,
        links: [
          { label: '> GitHub', url: 'https://github.com/lijw07/paws-and-hooves', type: 'secondary' },
          { label: '> Play', url: '#', type: 'primary' },
        ]
      },
      {
        title: 'Treasure Hunt',
        description: 'A treasure-hunting game with exploration mechanics and puzzles.',
        tags: ['Unity', 'C#', '2D'],
        thumbnail: null,
        links: [
          { label: '> GitHub', url: 'https://github.com/lijw07/TreasureHunt', type: 'secondary' },
          { label: '> Play', url: '#', type: 'primary' },
        ]
      },
      {
        title: 'Regurgitate',
        description: 'A game currently in development.',
        tags: ['Unity', 'C#', 'In Progress'],
        thumbnail: null,
        links: [
          { label: '> Coming Soon', url: '#', type: 'secondary' },
        ]
      }
    ];

    /* ── Render Cards ── */
    const grid = document.getElementById('games-grid');

    games.forEach((game, index) => {
      const card = document.createElement('div');
      card.className = 'game-card fade-in';
      card.style.transitionDelay = `${index * 0.15}s`;

      const thumbnailHTML = game.thumbnail
        ? `<div class="game-card-thumbnail"><img src="${game.thumbnail}" alt="${game.title}" /></div>`
        : `<div class="game-card-placeholder">?</div>`;

      const tagsHTML = game.tags.map(t => `<span class="tag">${t}</span>`).join('');

      const linksHTML = game.links.map(l =>
        `<a href="${l.url}" target="_blank" rel="noopener noreferrer" class="btn ${l.type === 'primary' ? 'btn-primary' : ''}">${l.label}</a>`
      ).join('');

      card.innerHTML = `
        ${thumbnailHTML}
        <div class="game-card-body">
          <div>
            <h2 class="game-card-title">${game.title}</h2>
            <p class="game-card-description">${game.description}</p>
            <div class="game-card-tags">${tagsHTML}</div>
          </div>
          <div class="game-card-actions">${linksHTML}</div>
        </div>
      `;

      grid.appendChild(card);
    });

    /* ── Scroll Fade ── */
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
        }
      });
    }, { threshold: 0.1 });

    document.querySelectorAll('.fade-in').forEach(el => observer.observe(el));
  </script>
</body>
</html>
